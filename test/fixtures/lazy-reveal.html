<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:20px Arial}.section{height:1000px;padding:40px;box-sizing:border-box;opacity:0;transition:opacity .1s}.section.visible{opacity:1}img{width:80px;height:80px}</style></head><body><header id="fixture-header" style="position:fixed;top:0;height:24px;background:#135;color:white">Brand</header><section class="section"><h1>First revealed section</h1><img loading="lazy" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="></section><section class="section"><h2>Second revealed section</h2><img loading="lazy" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="></section><section class="section"><h2>Third revealed section</h2></section><script>const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('visible')}),{threshold:.01});document.querySelectorAll('.section').forEach(section=>observer.observe(section));</script></body></html>
