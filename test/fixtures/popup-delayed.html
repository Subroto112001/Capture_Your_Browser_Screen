<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;font:20px Arial}main{height:2200px;background:linear-gradient(white,#cde)}.modal-backdrop{position:fixed;inset:0;background:#000c;z-index:99}.promo{position:fixed;z-index:100;left:30%;top:25%;width:40%;height:45%;background:#fff;padding:32px;box-sizing:border-box}</style></head><body><header id="fixture-header">Site header</header><main><h1>Main page content</h1></main><script>setTimeout(()=>{const backdrop=document.createElement('div');backdrop.className='modal-backdrop';const modal=document.createElement('section');modal.className='promo';modal.setAttribute('role','dialog');modal.innerHTML='<h2>Promotion</h2><button aria-label="Close">Close</button>';document.body.append(backdrop,modal);modal.querySelector('button').onclick=()=>{backdrop.remove();modal.remove()};},3000)</script></body></html>
